<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Sai! 💙</title>
    <style>
        :root {
            --bg: #0b0e14;
            --accent: #38bdf8;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        h1 { font-size: 1.6rem; color: var(--accent); letter-spacing: 1px; margin: 0; }
        .baby-text { font-size: 1.1rem; opacity: 0.8; margin-top: 5px; }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 92%;
            max-width: 400px; /* Forces it to stay mobile-sized */
            padding-bottom: 50px;
        }

        /* COMPACT TICKET DESIGN */
        .coupon {
            display: flex;
            height: 85px;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: 0.2s;
        }

        .coupon:active { transform: scale(0.97); }

        .coupon::before, .coupon::after {
            content: '';
            position: absolute;
            width: 16px; height: 16px;
            background: var(--bg);
            border-radius: 50%;
            left: 62px; z-index: 5;
        }
        .coupon::before { top: -8px; }
        .coupon::after { bottom: -8px; }

        .left {
            width: 70px;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            border-right: 1.5px dashed rgba(255,255,255,0.2);
        }

        .right {
            flex: 1;
            padding-left: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right h2 { margin: 0; font-size: 1rem; text-transform: uppercase; }
        .right p { margin: 2px 0 0; font-size: 0.65rem; letter-spacing: 1px; color: #cbd5e1; }

        .redeemed { filter: grayscale(1) opacity(0.3) !important; pointer-events: none; }

        /* OVERLAYS */
        #overlay {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 25px;
            text-align: center;
        }

        #overlay h2 { font-size: 2.2rem; margin-bottom: 10px; }
        #overlay p { font-size: 1.2rem; line-height: 1.4; margin-bottom: 25px; }

        .btn {
            background: white; color: black; border: none;
            padding: 12px 30px; border-radius: 25px;
            font-weight: bold; font-size: 1rem;
        }

        /* FIREWORK ANIMATION */
        .fw {
            position: fixed; pointer-events: none;
            width: 5px; height: 5px; border-radius: 50%;
            z-index: 2000; animation: explode 0.6s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }

        #final-screen {
            display: none; position: fixed; inset: 0;
            background: #020617; z-index: 2000;
            flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 20px;
        }

        .music-toggle {
            position: fixed; bottom: 15px; right: 15px;
            background: rgba(255,255,255,0.1); border: 1px solid white;
            color: white; border-radius: 50%; width: 40px; height: 40px; z-index: 3000;
        }
    </style>
</head>
<body>

<button class="music-toggle" onclick="toggleMusic()">🎵</button>
<audio id="bg-audio" loop src="https://www.chosic.com/wp-content/uploads/2021/04/Warm-Memories-Beautiful-Ambience.mp3"></audio>

<header>
    <h1>HBD SAI! 💙</h1>
    <div class="baby-text">Happy Birthday, Baby! Open your gifts...</div>
</header>

<div class="container" id="grid"></div>

<div id="overlay">
    <h2 id="otitle"></h2>
    <p id="omsg"></p>
    <button class="btn" onclick="closeOverlay()">I LOVE YOU! ❤️</button>
</div>

<div id="final-screen">
    <h1 style="color:var(--accent)">HAPPY BIRTHDAY SAI! 🏆</h1>
    <p style="font-size: 1.1rem; margin: 15px 0;">All coupons are yours, Baby. <br> No expiry. Let's make memories!</p>
    <div style="font-size: 4rem;">🍻🥩🏎️🔥</div>
    <button class="btn" style="margin-top:20px;" onclick="location.reload()">RE-WATCHSurprise</button>
</div>

<script>
    const gifts = [
        { icon: '🛍️', title: 'Shopping Spree', col: 'linear-gradient(90deg, #0ea5e9, #2563eb)', bg: '#172554', msg: 'Whatever you want today, Baby. Let\'s go get it! 🛍️🔥' },
        { icon: '🥩', title: 'Favorite Meal', col: 'linear-gradient(90deg, #f97316, #dc2626)', bg: '#450a0a', msg: 'Steak, Beer, and no dishes for you today, Sai! 🍻🥩' },
        { icon: '🎬', title: 'Game/Movie Night', col: 'linear-gradient(90deg, #8b5cf6, #d946ef)', bg: '#2e1065', msg: 'The remote is all yours tonight, Baby. No complaints! 🎮📺' },
        { icon: '🎁', title: 'Mystery Gift', col: 'linear-gradient(90deg, #10b981, #059669)', bg: '#064e3b', msg: 'I have a secret surprise waiting for you, Sai... 🎁✨' },
        { icon: '💆‍♂️', title: 'Long Massage', col: 'linear-gradient(90deg, #06b6d4, #0891b2)', bg: '#083344', msg: 'Thirty minutes of pure relaxation for my hardworking man. 🧖‍♂️🔋' },
        { icon: '🚗', title: 'Road Trip', col: 'linear-gradient(90deg, #10b981, #3b82f6)', bg: '#064e3b', msg: 'Just us, the car, and the open road. Let\'s go, Baby! 🛣️💨' },
        { icon: '🎆', title: 'ONE WISH', col: 'linear-gradient(90deg, #facc15, #f59e0b)', bg: '#000000', msg: 'FIREWORKS! This is your wildcard, Sai. Use it for anything! 🧨🔥' }
    ];

    let claimed = 0;
    const grid = document.getElementById('grid');

    gifts.forEach(g => {
        const div = document.createElement('div');
        div.className = 'coupon';
        div.style.background = g.col;
        div.innerHTML = `<div class="left">${g.icon}</div><div class="right"><h2>${g.title}</h2><p>OFFICIAL VOUCHER</p></div>`;
        div.onclick = () => {
            document.getElementById('otitle').innerText = g.title;
            document.getElementById('omsg').innerText = g.msg;
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('overlay').style.backgroundColor = g.bg;
            if(!div.classList.contains('redeemed')) {
                div.classList.add('redeemed');
                claimed++;
                firework();
            }
        };
        grid.appendChild(div);
    });

    function firework() {
        for(let i=0; i<40; i++) {
            const f = document.createElement('div');
            f.className = 'fw';
            f.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
            f.style.left = '50%'; f.style.top = '50%';
            f.style.setProperty('--x', (Math.random()-0.5)*400 + 'px');
            f.style.setProperty('--y', (Math.random()-0.5)*600 + 'px');
            document.body.appendChild(f);
            setTimeout(()=>f.remove(), 600);
        }
    }

    function closeOverlay() {
        document.getElementById('overlay').style.display = 'none';
        if(claimed === gifts.length) document.getElementById('final-screen').style.display = 'flex';
    }

    function toggleMusic() {
        const a = document.getElementById('bg-audio');
        a.paused ? a.play() : a.pause();
    }
</script>
</body>
</html>
