<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gift To You 💖</title>
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            --coupon-pink: #ff8e91;
            --coupon-blue: #8ec5fc;
            --coupon-gold: #f6d365;
            --text-main: #4a4a4a;
        }

        body {
            margin: 0;
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            background: var(--bg-grad);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: var(--text-main);
        }

        header {
            text-align: center;
            padding: 50px 20px;
        }

        h1 { font-size: 2.2rem; color: #d63384; text-shadow: 1px 1px 2px white; }

        /* CREATIVE COUPON DESIGN */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1100px;
            padding-bottom: 50px;
        }

        .coupon {
            height: 160px;
            background: white;
            border-radius: 15px;
            display: flex;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .coupon:hover { transform: scale(1.03); }

        .coupon.redeemed { opacity: 0.6; filter: grayscale(0.8); pointer-events: none; }

        /* Ticket Cutouts */
        .coupon::before, .coupon::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: #e2d1c3; /* Matches background */
            border-radius: 50%;
            left: 75px;
            z-index: 2;
        }
        .coupon::before { top: -15px; }
        .coupon::after { bottom: -15px; }

        .left-side {
            width: 90px;
            background: var(--color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            border-right: 2px dashed #ddd;
        }

        .right-side {
            flex: 1;
            padding: 20px 20px 20px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-side h2 { margin: 0; font-size: 1.2rem; color: #333; }
        .right-side p { margin: 5px 0 0; font-size: 0.9rem; color: #777; }

        /* FULL SCREEN OVERLAYS */
        #event-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }

        #event-overlay h2 { font-size: 3rem; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        #event-overlay p { font-size: 1.5rem; max-width: 600px; line-height: 1.4; }

        .close-overlay {
            margin-top: 30px;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* ANIMATIONS */
        @keyframes firework {
            0% { transform: translateY(100vh); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translateY(-20vh); opacity: 0; }
        }

        .particle {
            position: absolute;
            font-size: 2rem;
            animation: floatUp 3s forwards ease-out;
        }

        @keyframes floatUp {
            to { transform: translateY(-100vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        #final-screen {
            display: none;
            text-align: center;
            padding: 100px 20px;
            animation: fadeIn 2s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

<header id="main-header">
    <h1>🎀 My Special Promises To You 🎀</h1>
    <p>Click a ticket to redeem your birthday surprise...</p>
</header>

<div class="grid" id="coupon-grid">
    </div>

<div id="final-screen">
    <h1 style="font-size: 4rem;">Happy Birthday! 💖</h1>
    <p style="font-size: 1.5rem;">Every single coupon is now yours. No expiry, just us. I love you to the moon and back!</p>
    <div style="font-size: 5rem;">🏠👩‍❤️‍👨✨</div>
</div>

<div id="event-overlay">
    <div id="visuals"></div>
    <h2 id="event-title"></h2>
    <p id="event-msg"></p>
    <button class="close-overlay" onclick="closeOverlay()">Keep it for later ✨</button>
</div>

<script>
    const data = [
        { icon: '🛍️', title: 'Shopping Spree', color: '#ff8e91', bg: '#ff4d6d', msg: 'Pack your bags (the empty ones)! Today, we shop until you drop. Your wish is my command! 💳✨', effect: '💸' },
        { icon: '🍽️', title: 'Candlelight Dinner', color: '#f6d365', bg: '#fb8500', msg: 'A table for two, your favorite cuisine, and me looking at you all night. 🥂🍝', effect: '🕯️' },
        { icon: '🎬', title: 'Movie Night', color: '#8ec5fc', bg: '#023e8a', msg: 'Popcorn, blankets, and your choice of movie. I promise not to talk during the best parts! 🍿🎬', effect: '⭐' },
        { icon: '🎁', title: 'Mystery Gift', color: '#a18cd1', bg: '#5a189a', msg: 'Something special is waiting for you. It’s small, but full of love. 🎁❤️', effect: '✨' },
        { icon: '💆‍♀️', title: 'Relaxing Spa', color: '#84fab0', bg: '#2d6a4f', msg: 'Deep breaths and total relaxation. You deserve to be pampered like a queen. 🧖‍♀️🌿', effect: '🌸' },
        { icon: '🚗', title: 'Road Trip', color: '#fccb90', bg: '#e63946', msg: 'Windows down, music up! Let\'s go somewhere we\'ve never been before. 🛣️💨', effect: '🚗' },
        { icon: '✨', title: 'Firecracker Wish', color: '#4facfe', bg: '#000814', msg: 'BOOM! This is your ultimate wildcard. Ask for anything, and I\'ll make it happen! 🎆💥', effect: '🎇' }
    ];

    let redeemed = 0;
    const grid = document.getElementById('coupon-grid');
    const overlay = document.getElementById('event-overlay');

    data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'coupon';
        card.style.setProperty('--color', item.color);
        card.innerHTML = `
            <div class="left-side">${item.icon}</div>
            <div class="right-side">
                <h2>${item.title}</h2>
                <p>Valid Forever • Tap to Redeem</p>
            </div>
        `;
        card.onclick = () => triggerEvent(item, card);
        grid.appendChild(card);
    });

    function triggerEvent(item, element) {
        if(element.classList.contains('redeemed')) return;
        
        // Setup Overlay
        overlay.style.display = 'flex';
        overlay.style.backgroundColor = item.bg;
        document.getElementById('event-title').innerText = item.title;
        document.getElementById('event-msg').innerText = item.msg;

        // Create "Sound" Visuals (Particles)
        for(let i=0; i<30; i++) {
            createParticle(item.effect);
        }

        element.classList.add('redeemed');
        redeemed++;
    }

    function createParticle(symbol) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerText = symbol;
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = '100vh';
        p.style.animationDuration = (Math.random() * 2 + 1) + 's';
        overlay.appendChild(p);
        setTimeout(() => p.remove(), 3000);
    }

    function closeOverlay() {
        overlay.style.display = 'none';
        // Clear particles
        const particles = document.querySelectorAll('.particle');
        particles.forEach(p => p.remove());

        if(redeemed === data.length) {
            document.getElementById('main-header').style.display = 'none';
            grid.style.display = 'none';
            document.getElementById('final-screen').style.display = 'block';
            document.body.style.background = "white";
        }
    }
</script>

</body>
</html>
