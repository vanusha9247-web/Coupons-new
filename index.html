<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HBD SAI | Surprise Box</title>
    <style>
        :root { --bg: #0b0f1a; --accent: #38bdf8; }
        body {
            margin: 0; font-family: 'Helvetica Neue', sans-serif;
            background-color: var(--bg); color: white;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden; -webkit-tap-highlight-color: transparent;
        }
        header { text-align: center; padding: 40px 20px 20px; }
        h1 { font-size: 1.8rem; color: var(--accent); letter-spacing: 2px; margin: 0; text-transform: uppercase; }
        .sub { font-size: 0.85rem; opacity: 0.6; margin-top: 8px; letter-spacing: 1px; }

        .container {
            display: flex; flex-direction: column; gap: 12px;
            width: 90%; max-width: 380px; padding-bottom: 60px;
        }

        .coupon {
            display: flex; height: 85px; border-radius: 12px;
            position: relative; cursor: pointer; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: 0.2s;
        }
        .coupon:active { transform: scale(0.96); }

        .coupon::before, .coupon::after {
            content: ''; position: absolute; width: 18px; height: 18px;
            background: var(--bg); border-radius: 50%; left: 66px; z-index: 5;
        }
        .coupon::before { top: -9px; }
        .coupon::after { bottom: -9px; }

        .left {
            width: 75px; background: rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; border-right: 1.5px dashed rgba(255,255,255,0.2);
        }
        .right { flex: 1; padding-left: 20px; display: flex; flex-direction: column; justify-content: center; }
        .right h2 { margin: 0; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .right p { margin: 2px 0 0; font-size: 0.65rem; color: rgba(255,255,255,0.5); font-weight: bold; }

        .redeemed { filter: grayscale(1) opacity(0.3) !important; pointer-events: none; }

        #overlay {
            position: fixed; inset: 0; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; padding: 30px; text-align: center;
        }
        #overlay h2 { font-size: 2rem; margin-bottom: 15px; }
        #overlay p { font-size: 1.25rem; line-height: 1.5; margin-bottom: 30px; max-width: 400px; }

        .btn {
            background: white; color: black; border: none;
            padding: 14px 35px; border-radius: 30px;
            font-weight: bold; font-size: 1rem; cursor: pointer;
        }

        .fw {
            position: fixed; pointer-events: none; width: 6px; height: 6px;
            border-radius: 50%; z-index: 2000; animation: explode 0.7s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }

        #final-screen {
            display: none; position: fixed; inset: 0;
            background: radial-gradient(circle, #1e293b, #020617);
            z-index: 5000; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 25px;
        }

        .music-toggle {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(255,255,255,0.1); border: 1px solid white;
            color: white; border-radius: 50%; width: 45px; height: 45px; z-index: 6000;
        }
    </style>
</head>
<body>

<button class="music-toggle" onclick="toggleMusic()">🎵</button>
<audio id="bg-audio" loop src="https://www.chosic.com/wp-content/uploads/2021/04/Warm-Memories-Beautiful-Ambience.mp3"></audio>

<header>
    <h1>Happy Birthday, Sai</h1>
    <p class="sub">Select a voucher to redeem your gifts</p>
</header>

<div class="container" id="grid"></div>

<div id="overlay">
    <h2 id="otitle"></h2>
    <p id="omsg"></p>
    <button class="btn" onclick="closeOverlay()">REDEEMED ✨</button>
</div>

<div id="final-screen">
    <h1 style="color:var(--accent); font-size: 2.5rem;">CHEERS, SAI! 🏆</h1>
    <p style="font-size: 1.1rem; margin: 20px 0; max-width: 320px; line-height: 1.6;">Every voucher is now officially active. Let's make this year legendary.</p>
    <div style="font-size: 4rem;">🍛 🍻 🚗 🦾</div>
    <button class="btn" style="margin-top:40px;" onclick="location.reload()">RE-WATCH SURPRISE</button>
</div>

<script>
    const gifts = [
        { icon: '🛍️', title: 'Shopping Spree', col: 'linear-gradient(90deg, #0ea5e9, #2563eb)', bg: '#172554', msg: 'Time for an upgrade. Today is all about your wishlist, Sai. Let’s go shopping! 💳🔥' },
        { icon: '🥘', title: 'Home Cooked Favorite', col: 'linear-gradient(90deg, #f97316, #dc2626)', bg: '#450a0a', msg: 'You name the dish, and I’ll make it exactly how you like it. The kitchen is yours today! 🥘✨' },
        { icon: '🎬', title: 'Your Choice', col: 'linear-gradient(90deg, #8b5cf6, #d946ef)', bg: '#2e1065', msg: 'Total control. You pick the movie, the series, or the game tonight. No arguments! 🍿🎮' },
        { icon: '🎁', title: 'Mystery Gift', col: 'linear-gradient(90deg, #10b981, #059669)', bg: '#064e3b', msg: 'A special surprise I picked out because it reminded me of you. Go find it! 🎁✨' },
        { icon: '💆‍♂️', title: 'Relaxation', col: 'linear-gradient(90deg, #06b6d4, #0891b2)', bg: '#083344', msg: 'Reset and recharge. A long, relaxing massage for the most hardworking man I know. 🧖‍♂️🔋' },
        { icon: '🛣️', title: 'The Road Trip', col: 'linear-gradient(90deg, #10b981, #3b82f6)', bg: '#14532d', msg: 'Pick a destination, put on your favorite playlist, and let’s drive. 🚗💨' },
        { icon: '🎆', title: 'The Wish', col: 'linear-gradient(90deg, #facc15, #f59e0b)', bg: '#000000', msg: 'The Wildcard. One request, no questions asked. Consider it done. Happy Birthday, Sai! 🎇🔥' }
    ];

    let claimed = 0;
    const grid = document.getElementById('grid');

    gifts.forEach(g => {
        const div = document.createElement('div');
        div.className = 'coupon';
        div.style.background = g.col;
        div.innerHTML = `<div class="left">${g.icon}</div><div class="right"><h2>${g.title}</h2><p>OFFICIAL VOUCHER</p></div>`;
        div.onclick = () => {
            document.getElementById('otitle').innerText = g.title;
            document.getElementById('omsg').innerText = g.msg;
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('overlay').style.backgroundColor = g.bg;
            if(!div.classList.contains('redeemed')) {
                div.classList.add('redeemed');
                claimed++;
                firework();
            }
        };
        grid.appendChild(div);
    });

    function firework() {
        for(let i=0; i<50; i++) {
            const f = document.createElement('div');
            f.className = 'fw';
            f.style.background = `hsl(${Math.random()*360}, 100%, 60%)`;
            f.style.left = '50%'; f.style.top = '50%';
            f.style.setProperty('--x', (Math.random()-0.5)*500 + 'px');
            f.style.setProperty('--y', (Math.random()-0.5)*800 + 'px');
            document.body.appendChild(f);
            setTimeout(()=>f.remove(), 700);
        }
    }

    function closeOverlay() {
        document.getElementById('overlay').style.display = 'none';
        if(claimed === gifts.length) document.getElementById('final-screen').style.display = 'flex';
    }

    function toggleMusic() {
        const a = document.getElementById('bg-audio');
        if (a.paused) { a.play(); } else { a.pause(); }
    }
</script>
</body>
</html>
